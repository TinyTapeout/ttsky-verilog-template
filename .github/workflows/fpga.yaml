name: fpga

on:
  push:
    # Comment out (or remove) the following line to run the FPGA workflow on every push:
    branches: none
  workflow_dispatch:
    inputs:
      build-ulx3s:
        description: 'Build ULX3S FPGA bitstream'
        type: boolean
        default: false

jobs:
  fpga:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: FPGA bitstream for TT ASIC Sim (ICE40UP5K)
        uses: TinyTapeout/tt-gds-action/fpga/ice40up5k@ttsky26d

  # Optional job for ULX3S FPGA board.
  # For ULX3S support, see the #TinyTapeout channel on the Radiona Discord.
  # Invitation link: https://discord.gg/qwMUk6W
  # GitHub Marketplace: https://github.com/marketplace/actions/tiny-tapeout-gds-action-for-the-ulx3s-and-ulx4m-ecp5-fpga
  fpga-ulx3s:
    if: ${{ inputs.build-ulx3s == true }}
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: FPGA bitstream for TT ASIC Sim (ULX3S ECP5 with v316 LPF)
        uses: ulx3s/tt-gds-action/fpga/ulx3s@experimental
        with:
          # Explicitly override the support tools repository and branch.
          tools-repo: ulx3s/tt-support-tools
          tools-ref: experimental
          ecp5-device: 85k
          # LPF files come from tools-repo, checked out by the action into tt/.
          # See https://github.com/ulx3s/tt-support-tools/tree/experimental/fpga/ulx3s
          lpf: tt/fpga/ulx3s/ulx3s_v316.lpf
          artifact-name: fpga_ulx3s_ecp5_v316
          uart-enabled: false
