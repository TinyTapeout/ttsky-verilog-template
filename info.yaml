project:
  title:        "VGA Clock Demo"
  author:       "electron65"
  discord:      "john_is_wicked"
  description:  "VGA analog/digital clock with sync output"
  language:     "Verilog"
  clock_hz:     25000000   # VGA용 (25MHz 권장)

  tiles: "1x1"

  top_module:  "tt_um_electron65_vga"

  source_files:
    - "clock_top.v"
    - "clock_controller.v"
    - "clock.v"
    - "hvsync_generator.v"
    - "vga_clock_draw.v"
    - "hand_60dir.v"

pinout:
  # Inputs
  ui[0]: "mode"
  ui[1]: "select"
  ui[2]: "up"
  ui[3]: "down"
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "hsync"
  uo[1]: "vsync"
  uo[2]: "red"
  uo[3]: "green"
  uo[4]: "blue"
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

yaml_version: 6
