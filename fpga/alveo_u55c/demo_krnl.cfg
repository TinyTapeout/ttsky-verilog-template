# v++ link config for the self-contained NTT/INTT round-trip demo kernel.
# No memory-mapped AXI master ports needed -- the kernel generates its own
# test vector on-chip and reports pass/fail via the AXI-Lite control bus.
platform=xilinx_u55c_gen3x16_xdma_3_202210_1

[connectivity]
nk=demo_top_krnl:1:demo_top_krnl_1

[clock]
freqHz=300000000:demo_top_krnl_1
